<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Kiểm Tra Tin Học 8 BT TƯƠNG TÁC - Cô Yến Thanh</title>
    <style>
        :root {
            --primary-purple: #6A1B9A;
            --3d-shadow: 0 4px 0 #4A148C;
            --accent-yellow: #FFEB3B;
            --white: #FFFFFF;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 1px solid #ddd;
        }

        /* DÒNG 1: Tiêu đề 3D */
        .title-header {
            text-align: center;
            background-color: var(--primary-purple);
            color: var(--white);
            padding: 15px 20px;
            border: 4px ridge #ce93d8;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.5rem;
            text-transform: uppercase;
            box-shadow: var(--3d-shadow);
            margin-bottom: 10px;
            position: relative;
            top: -2px;
        }

        /* DÒNG 2: Tên giáo viên */
        .teacher-name {
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: #FFD600;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        /* DÒNG 3: Điều khiển */
        .controls-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            align-items: center;
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            border: 1px dashed #ccc;
            margin-bottom: 20px;
        }

        .input-group { display: flex; flex-direction: column; gap: 5px; }
        input[type="text"] { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        
        button {
            padding: 10px 15px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            transition: all 0.2s;
        }

        .btn-start { background-color: #4CAF50; color: white; }
        .btn-submit { background-color: #2196F3; color: white; }
        .btn-reset { background-color: #f44336; color: white; }
        .btn-show { background-color: #FF9800; color: white; }
        
        button:disabled { background-color: #ccc; cursor: not-allowed; }

        .score-display {
            background: #fff;
            border: 2px solid var(--primary-purple);
            padding: 5px 10px;
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
            min-width: 60px;
            color: #d32f2f;
        }

        .timer-display {
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.4rem;
            color: #e65100;
            font-weight: bold;
            text-align: center;
        }

        /* KHÔNG GIAN CÂU HỎI */
        .quiz-space {
            height: 450px;
            overflow-y: auto;
            border: 1px solid #eee;
            padding: 20px;
            background: #fff;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        .question-item {
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #f0f0f0;
        }

        .question-text { font-weight: bold; margin-bottom: 12px; color: #333; }
        .options-container { display: flex; flex-direction: column; gap: 8px; }
        .option-label { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 5px; }
        .input-fill { width: 80%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .answer-key { display: none; color: #2e7d32; font-style: italic; margin-top: 10px; font-weight: bold; }

        .footer-buttons { display: flex; justify-content: center; gap: 15px; padding-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="title-header">BÀI KIỂM TRA TIN HỌC TƯƠNG TÁC LỚP 8 – CHÂN TRỜI SÁNG TẠO</div>
    <div class="teacher-name">CÔ YẾN THANH</div>

    <div class="controls-row">
        <div class="input-group">
            <input type="text" id="studentName" placeholder="Họ và tên học sinh">
        </div>
        <div class="input-group">
            <input type="text" id="studentClass" placeholder="Lớp">
        </div>
        <button class="btn-start" id="btnStart" onclick="startQuiz()">Làm bài</button>
        <div style="text-align: center;">
            <label style="font-size: 0.8rem; font-weight: bold;">Điểm tổng:</label>
            <div id="finalScore" class="score-display">--</div>
        </div>
        <div class="timer-display" id="timer">200</div>
    </div>

    <div class="quiz-space" id="quizContainer">
        <p style="text-align: center; color: #888;">Hãy nhập thông tin và nhấn "Làm bài".</p>
    </div>

    <div class="footer-buttons">
        <button class="btn-submit" id="btnSubmit" onclick="submitQuiz()" disabled>Nộp bài</button>
        <button class="btn-reset" id="btnReset" onclick="resetQuiz()">Làm lại bài</button>
        <button class="btn-show" id="btnShow" onclick="showAnswers()" disabled>Hiện đáp án</button>
    </div>
</div>

<script>
    // --- CẤU HÌNH ---
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz62nxuIGrm-aBpulGgoPSU8vYEe1alx3VJyzCHB-D8CWPgWlx6Ep8DHg4XD0JBI2eCew/exec";
    const TOTAL_TIME = 600;
    let timeLeft = TOTAL_TIME;
    let timerId = null;
    let hasSubmitted = false;
    let answersShown = false;

    // --- NGÂN HÀNG CÂU HỎI (20 CÂU: 10 MCQ, 8 T/F, 2 FILL) ---
    const questions = [
        // 10 Trắc nghiệm (0.5đ/câu)
        { type: "mcq", q: "Để chèn một hình khối (hình chữ nhật, hình tròn...), em vào thẻ Insert và chọn lệnh nào?", options: ["Pictures", "Shapes", "Icons", "Table"], ans: "B" },
        { type: "mcq", q: "Nút lệnh 'Shape Fill' dùng để làm gì đối với hình dạng?", options: ["Thay đổi màu đường viền", "Đổ màu nền bên trong hình", "Xoay hình", "Xóa hình"], ans: "B" },
        { type: "mcq", q: "Để thay đổi màu sắc và độ dày của đường viền hình dạng, em sử dụng lệnh nào?", options: ["Shape Fill", "Shape Outline", "Shape Effects", "Edit Shape"], ans: "B" },
        { type: "mcq", q: "Lệnh 'Flip Horizontal' trong nhóm Rotate có tác dụng gì?", options: ["Lật hình theo chiều dọc", "Lật hình theo chiều ngang", "Xoay hình 90 độ", "Phóng to hình"], ans: "B" },
        { type: "mcq", q: "Tiêu đề lặp lại ở đầu mỗi trang giấy được gọi là gì?", options: ["Footer", "Header", "Page Number", "Title"], ans: "B" },
        { type: "mcq", q: "Để chèn thông tin lặp lại ở cuối mỗi trang, em chọn lệnh nào?", options: ["Header", "Footer", "WordArt", "Text Box"], ans: "B" },
        { type: "mcq", q: "Thao tác đánh số trang tự động nằm trong lệnh nào của thẻ Insert?", options: ["Page Number", "Symbol", "Object", "Bookmark"], ans: "A" },
        { type: "mcq", q: "Lệnh 'Flip Vertical' dùng để thực hiện thao tác nào?", options: ["Lật hình qua trái", "Lật hình lên xuống (chiều dọc)", "Xoay hình tròn", "Cắt hình"], ans: "B" },
        { type: "mcq", q: "Muốn thêm hiệu ứng đổ bóng hoặc 3D cho hình dạng, em chọn lệnh?", options: ["Shape Outline", "Shape Fill", "Shape Effects", "Bring Forward"], ans: "C" },
        { type: "mcq", q: "Trong Word, em có thể thêm văn bản vào bên trong hình dạng bằng cách?", options: ["Nháy đúp vào hình", "Chuột phải chọn Add Text", "Cả 2 cách trên đều đúng", "Không thể thêm văn bản"], ans: "C" },

        // 8 Đúng/Sai (0.5đ/câu)
        { type: "tf", q: "Header và Footer sẽ xuất hiện ở tất cả các trang của văn bản.", ans: "Đúng" },
        { type: "tf", q: "Ta có thể chèn cả hình ảnh vào khu vực Header.", ans: "Đúng" },
        { type: "tf", q: "Lệnh Shape Outline dùng để thay đổi màu sắc bên trong của hình.", ans: "Sai" },
        { type: "tf", q: "Em chỉ có thể đánh số trang ở giữa trang.", ans: "Sai" },
        { type: "tf", q: "Lật hình (Flip) và Xoay hình (Rotate) là hai thao tác hoàn toàn giống nhau.", ans: "Sai" },
        { type: "tf", q: "Muốn lật hình, em cần chọn hình đó trước để hiện thẻ Picture Format hoặc Shape Format.", ans: "Đúng" },
        { type: "tf", q: "Tiêu đề trang giúp văn bản trông chuyên nghiệp và dễ theo dõi hơn.", ans: "Đúng" },
        { type: "tf", q: "Không thể thay đổi độ dày của đường viền hình dạng.", ans: "Sai" },

        // 2 Điền khuyết (0.5đ/câu)
        { type: "fill", q: "Để xoay hoặc lật một hình dạng, em sử dụng lệnh ________.", ans: "rotate" },
        { type: "fill", q: "Phần tiêu đề nằm ở lề trên của mỗi trang văn bản gọi là ________.", ans: "header" }
    ];

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function startQuiz() {
        const name = document.getElementById("studentName").value.trim();
        const className = document.getElementById("studentClass").value.trim();
        if (!name || !className) { return alert("Vui lòng nhập Họ tên và Lớp!"); }

        document.getElementById("btnStart").disabled = true;
        document.getElementById("btnSubmit").disabled = false;
        document.getElementById("btnShow").disabled = false;
        
        shuffle(questions);
        renderQuestions();
        startTimer();
    }

    function renderQuestions() {
        const container = document.getElementById("quizContainer");
        container.innerHTML = "";
        questions.forEach((item, index) => {
            const div = document.createElement("div");
            div.className = "question-item";
            let html = `<div class="question-text">Câu ${index + 1}. ${item.q}</div>`;
            if (item.type === "mcq") {
                html += `<div class="options-container">`;
                item.options.forEach((opt, i) => {
                    const label = String.fromCharCode(65 + i);
                    html += `<label class="option-label"><input type="radio" name="q${index}" value="${label}"> ${label}. ${opt}</label>`;
                });
                html += `</div>`;
            } else if (item.type === "tf") {
                html += `<div class="options-container">
                    <label class="option-label"><input type="radio" name="q${index}" value="Đúng"> Đúng</label>
                    <label class="option-label"><input type="radio" name="q${index}" value="Sai"> Sai</label>
                </div>`;
            } else {
                html += `<input type="text" class="input-fill" id="fill${index}" placeholder="...">`;
            }
            html += `<div class="answer-key" id="ansKey${index}">Đáp án: ${item.ans}</div>`;
            div.innerHTML = html;
            container.appendChild(div);
        });
    }

    function startTimer() {
        timerId = setInterval(() => {
            timeLeft--;
            document.getElementById("timer").innerText = timeLeft;
            if (timeLeft <= 0) { clearInterval(timerId); submitQuiz(); }
        }, 1000);
    }

    async function submitQuiz() {
        if (hasSubmitted) return;
        clearInterval(timerId);
        hasSubmitted = true;
        document.getElementById("btnSubmit").disabled = true;

        let correct = 0;
        questions.forEach((item, index) => {
            let userAns = "";
            if (item.type === "mcq" || item.type === "tf") {
                const sel = document.querySelector(`input[name="q${index}"]:checked`);
                if (sel) userAns = sel.value;
            } else {
                userAns = document.getElementById(`fill${index}`).value.trim();
            }
            if (userAns.toLowerCase() === item.ans.toLowerCase()) correct++;
        });

        const score = parseFloat(((correct * 10) / questions.length).toFixed(1));
        document.getElementById("finalScore").innerText = score;

        const payload = {
            hoTen: document.getElementById("studentName").value,
            lop: document.getElementById("studentClass").value,
            diem: score,
            soDung: correct,
            tongSoCau: questions.length
        };

        try {
            await fetch(WEB_APP_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            alert("Nộp bài thành công!");
        } catch (e) { console.error(e); }
    }

    function resetQuiz() {
        if (answersShown) return alert("Không thể làm lại khi đã xem đáp án!");
        location.reload();
    }

    function showAnswers() {
        if (!hasSubmitted) return alert("Nộp bài trước khi xem đáp án!");
        answersShown = true;
        document.querySelectorAll(".answer-key").forEach(el => el.style.display = "block");
        document.getElementById("btnReset").disabled = true;
    }
</script>
</body>
</html>
